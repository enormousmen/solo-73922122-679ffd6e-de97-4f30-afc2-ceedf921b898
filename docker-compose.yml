services:
  classifier:
    build: .
    image: microbatch-classifier:latest
    ports:
      - "8000:8000"
    environment:
      # Spec limits (defaults already match the spec):
      MAX_CAPACITY: "16"      # max images queued or computing
      BATCH_SIZE: "4"         # max images per batch
      BATCH_WAIT_MS: "50"     # idle model waits at most 50 ms to fill a batch
      # Demo knob: simulate slow inference (ms). Submit/query/cancel stay
      # responsive regardless. Set e.g. "2000" to see the effect.
      INFERENCE_DELAY_MS: "0"
      # Demo knob: one-shot fault injection. The next N inference calls (a
      # batch or a recovery probe) raise. "true"/"1" = one failure; "2" lets
      # the first recovery probe fail too, so the retry can be demonstrated.
      INJECT_FAILURE_ONCE: "false"
      # Demo knob: artificial delay inside the recovery probe (ms). Queries
      # and cancels stay responsive while the probe runs.
      PROBE_DELAY_MS: "0"
    restart: unless-stopped
